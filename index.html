<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N-Body Astrodynamics & Solar System Projector</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010204; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
        canvas { display: block; touch-action: none; }
        
        .glass-panel {
            position: absolute;
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            transition: all 0.4s ease-in-out;
        }

        #setup-panel { top: 20px; left: 20px; width: 300px; z-index: 10; }
        #setup-panel.hidden { opacity: 0; pointer-events: none; transform: translateX(-50px); }
        
        #telemetry-hud { bottom: -200px; left: 20px; width: 280px; z-index: 10; padding: 15px; opacity: 0; }
        #telemetry-hud.active { bottom: 20px; opacity: 1; }

        #planet-info { top: 20px; right: -400px; width: 300px; z-index: 10; border-left: 4px solid #38bdf8; }
        #planet-info.active { right: 20px; }

        h2 { margin: 0 0 15px 0; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        h3 { margin: 0 0 5px 0; font-size: 20px; color: #fff; }
        
        .data-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .data-row { display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px dotted rgba(255,255,255,0.1); padding-bottom: 4px; }
        .data-label { color: #94a3b8; }
        .data-value { font-family: "Courier New", Courier, monospace; color: #10b981; font-weight: bold; }

        select { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #38bdf8; border-radius: 8px; margin-bottom: 15px; font-size: 14px; outline: none; }
        button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s; }
        button:active { background: #0369a1; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none; z-index: 5; transition: all 0.2s; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); border-radius: 50%; }
        body.pointing #crosshair { border-color: #38bdf8; transform: translate(-50%, -50%) scale(1.5); }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <!-- LAUNCH SETUP -->
    <div id="setup-panel" class="glass-panel">
        <h2>Mission Control</h2>
        <select id="target-selector">
            <option value="mercury">Target: Mercury</option>
            <option value="venus">Target: Venus</option>
            <option value="moon">Target: The Moon</option>
            <option value="mars">Target: Mars</option>
            <option value="jupiter">Target: Jupiter</option>
            <option value="saturn">Target: Saturn</option>
            <option value="uranus">Target: Uranus</option>
            <option value="neptune">Target: Neptune</option>
        </select>
        <button id="launch-btn">Initiate Launch</button>
    </div>

    <!-- FLIGHT TELEMETRY HUD -->
    <div id="telemetry-hud" class="glass-panel">
        <h2 style="font-size: 12px; margin-bottom: 10px;">Flight Telemetry</h2>
        <div class="data-grid">
            <div class="data-row"><span class="data-label">Phase:</span><span class="data-value" id="t-phase">Pre-Launch</span></div>
            <div class="data-row"><span class="data-label">Mass (kg):</span><span class="data-value" id="t-mass">4500.00</span></div>
            <div class="data-row"><span class="data-label">Velocity (km/s):</span><span class="data-value" id="t-vel">0.00</span></div>
            <div class="data-row"><span class="data-label">Atmos Drag (N):</span><span class="data-value" id="t-drag">0.00</span></div>
            <div class="data-row"><span class="data-label">Net Gravity (N):</span><span class="data-value" id="t-grav">0.00</span></div>
        </div>
    </div>

    <!-- PLANET SCANNER INFO -->
    <div id="planet-info" class="glass-panel">
        <h2>Astrophysical Data</h2>
        <h3 id="p-name">Planet Name</h3>
        <p style="font-size: 12px; color: #94a3b8; margin-top: -5px; margin-bottom: 15px;" id="p-type">Terrestrial Planet</p>
        <div class="data-grid">
            <div class="data-row"><span class="data-label">Gravity (m/s²):</span><span class="data-value" id="p-grav">--</span></div>
            <div class="data-row"><span class="data-label">Dist. from Sun (AU):</span><span class="data-value" id="p-au">--</span></div>
            <div class="data-row"><span class="data-label">Dist. to Earth:</span><span class="data-value" id="p-dist">--</span></div>
            <div class="data-row"><span class="data-label">Orbital Period:</span><span class="data-value" id="p-period">--</span></div>
        </div>
        <button id="close-info" style="margin-top: 15px; background: #334155;">Close Scanner</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const G = 6.67430e-11; 
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        // ADDED URANUS & NEPTUNE
        const bodies = {
            sun: { name: "The Sun", type: "G-Type Main-Sequence Star", color: 0xffddaa, radius: 25, visual_a: 0, au: 0, speed: 0, grav: 274, period: "25 Days" },
            mercury: { name: "Mercury", type: "Terrestrial Planet", color: 0x888888, radius: 1.5, visual_a: 40, au: 0.39, speed: 0.04, grav: 3.7, period: "88 Days" },
            venus: { name: "Venus", type: "Terrestrial Planet", color: 0xe3bb76, radius: 2.8, visual_a: 60, au: 0.72, speed: 0.03, grav: 8.87, period: "225 Days" },
            earth: { name: "Earth", type: "Terrestrial Planet", texture: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg', radius: 3.5, visual_a: 90, au: 1.0, speed: 0.025, grav: 9.8, period: "365.2 Days" },
            moon: { name: "The Moon", type: "Natural Satellite", texture: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg', radius: 1, visual_a: 8, au: 1.002, speed: 0.08, grav: 1.62, period: "27.3 Days", parent: "earth" },
            mars: { name: "Mars", type: "Terrestrial Planet", color: 0xc1440e, radius: 1.8, visual_a: 130, au: 1.52, speed: 0.02, grav: 3.72, period: "687 Days" },
            jupiter: { name: "Jupiter", type: "Gas Giant", color: 0xd39c7e, radius: 12, visual_a: 240, au: 5.20, speed: 0.01, grav: 24.79, period: "11.8 Years" },
            saturn: { name: "Saturn", type: "Gas Giant", color: 0xead6b8, radius: 10, visual_a: 350, au: 9.58, speed: 0.008, grav: 10.44, period: "29.5 Years", hasRings: true },
            uranus: { name: "Uranus", type: "Ice Giant", color: 0x93b8c4, radius: 7, visual_a: 450, au: 19.22, speed: 0.005, grav: 8.69, period: "84 Years", hasRings: true, verticalRings: true },
            neptune: { name: "Neptune", type: "Ice Giant", color: 0x3b5d82, radius: 6.8, visual_a: 550, au: 30.05, speed: 0.004, grav: 11.15, period: "165 Years" }
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010204);
        
        // Pulled camera further back to see Neptune
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 300, 700); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Increased light distance to illuminate outer planets
        scene.add(new THREE.PointLight(0xffffff, 50000, 5000));
        scene.add(new THREE.AmbientLight(0x222233));

        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(5000 * 3);
        for(let i=0; i<15000; i++) starsPos[i] = (Math.random() - 0.5) * 5000;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.6 })));

        const planetMeshes = {};
        let timeOffset = 0; 

        Object.keys(bodies).forEach(key => {
            const data = bodies[key];
            let mat = data.texture ? 
                new THREE.MeshStandardMaterial({ map: textureLoader.load(data.texture), roughness: 0.7 }) : 
                new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8 });
            
            if(key === 'sun') mat = new THREE.MeshBasicMaterial({ color: data.color });

            const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius, 32, 32), mat);
            mesh.userData = { id: key, ...data }; 
            scene.add(mesh);
            planetMeshes[key] = mesh;

            if (data.visual_a > 0 && !data.parent) {
                const ring = new THREE.Mesh(new THREE.RingGeometry(data.visual_a - 0.5, data.visual_a + 0.5, 128), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.08 }));
                ring.rotation.x = Math.PI / 2;
                scene.add(ring);
            }

            if(data.hasRings) {
                const ringColor = key === 'uranus' ? 0x93b8c4 : 0xc4b7a1;
                const rings = new THREE.Mesh(new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.2, 64), new THREE.MeshStandardMaterial({ color: ringColor, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
                // Uranus rolls on its side (90 degree tilt)
                rings.rotation.x = data.verticalRings ? 0 : Math.PI / 2 + 0.2;
                if(data.verticalRings) rings.rotation.y = Math.PI / 2;
                mesh.add(rings);
            }
        });

        // UI & INTERACTIVITY
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('pointerdown', (e) => {
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = (cx / window.innerWidth) * 2 - 1;
            mouse.y = -(cy / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Object.values(planetMeshes));
            
            if (intersects.length > 0 && intersects[0].object.userData.name) {
                const d = intersects[0].object.userData;
                document.getElementById('p-name').innerText = d.name;
                document.getElementById('p-type').innerText = d.type;
                document.getElementById('p-grav').innerText = d.grav;
                document.getElementById('p-au').innerText = d.au;
                document.getElementById('p-period').innerText = d.period;
                
                let dist = d.name === "Earth" || d.name === "The Sun" ? "N/A" : Math.abs(d.au - bodies.earth.au).toFixed(2);
                document.getElementById('p-dist').innerText = dist === "N/A" ? dist : `${dist} AU`;
                
                document.getElementById('planet-info').classList.add('active');
            }
        });
        
        document.getElementById('close-info').addEventListener('click', () => {
            document.getElementById('planet-info').classList.remove('active');
        });

        let missionActive = false;
        let satMesh, trailLine;
        
        let physicsState = {
            progress: 0, mass: 4500, velocity: 0, phase: "Pre-Launch",
            targetId: null, launchPos: null, orbitAngle: 0, trailPoints: []
        };

        document.getElementById('launch-btn').addEventListener('click', () => {
            if(missionActive) return;
            missionActive = true;
            physicsState.targetId = document.getElementById('target-selector').value;
            physicsState.launchPos = planetMeshes.earth.position.clone();

            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('telemetry-hud').classList.add('active');

            // FIXED: Emissive bright white material so it pops out clearly!
            satMesh = new THREE.Mesh(
                new THREE.ConeGeometry(0.5, 1.5, 8),
                new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6 })
            );
            satMesh.position.copy(physicsState.launchPos);
            scene.add(satMesh);

            // FIXED: frustumCulled = false prevents the line from vanishing on zoom!
            const trailMat = new THREE.LineBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.8, depthWrite: false });
            trailLine = new THREE.Line(new THREE.BufferGeometry(), trailMat);
            trailLine.frustumCulled = false; 
            scene.add(trailLine);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            timeOffset += 0.05;

            Object.keys(planetMeshes).forEach(key => {
                const mesh = planetMeshes[key];
                const data = bodies[key];
                if (data.parent === 'earth') {
                    mesh.position.x = planetMeshes.earth.position.x + data.visual_a * Math.cos(timeOffset * data.speed * 10);
                    mesh.position.z = planetMeshes.earth.position.z + data.visual_a * Math.sin(timeOffset * data.speed * 10);
                } else if (data.visual_a > 0) {
                    mesh.position.x = data.visual_a * Math.cos(timeOffset * data.speed);
                    mesh.position.z = data.visual_a * Math.sin(timeOffset * data.speed);
                }
                mesh.rotation.y += 0.01;
            });

            if (missionActive) {
                const targetMesh = planetMeshes[physicsState.targetId];

                if (physicsState.progress < 1) {
                    physicsState.progress += 0.002;
                    let t = physicsState.progress;

                    let p0 = physicsState.launchPos;
                    let p2 = targetMesh.position;
                    let p1 = new THREE.Vector3().addVectors(p0, p2).multiplyScalar(0.5);
                    
                    // FIXED: Dynamic arc height scales based on distance so it doesn't hit the sun
                    p1.y += (physicsState.targetId === 'moon') ? 10 : p0.distanceTo(p2) * 0.25; 

                    let currentPos = new THREE.Vector3(
                        (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x,
                        (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y,
                        (1-t)*(1-t)*p0.z + 2*(1-t)*t*p1.z + t*t*p2.z
                    );
                    satMesh.position.copy(currentPos);
                    
                    let nextT = Math.min(1, t + 0.01);
                    let lookPos = new THREE.Vector3(
                        (1-nextT)*(1-nextT)*p0.x + 2*(1-nextT)*nextT*p1.x + nextT*nextT*p2.x,
                        (1-nextT)*(1-nextT)*p0.y + 2*(1-nextT)*nextT*p1.y + nextT*nextT*p2.y,
                        (1-nextT)*(1-nextT)*p0.z + 2*(1-nextT)*nextT*p1.z + nextT*nextT*p2.z
                    );
                    satMesh.lookAt(lookPos);
                    satMesh.rotateX(Math.PI / 2);

                    if (t < 0.2) { physicsState.mass -= 3.2; physicsState.velocity += 0.05; }
                    else if (t > 0.8) { physicsState.phase = "Orbital Insertion Burn"; physicsState.mass -= 1.6; physicsState.velocity -= 0.02; }
                    else { physicsState.phase = "Hohmann Transfer Coasting"; }

                    let drag = (t < 0.05) ? 0.5 * ((0.05 - t) * 20) * (physicsState.velocity**2) * 2.5 : 0;
                    
                    document.getElementById('t-phase').innerText = physicsState.phase;
                    document.getElementById('t-mass').innerText = Math.max(1200, physicsState.mass).toFixed(2);
                    document.getElementById('t-vel').innerText = physicsState.velocity.toFixed(2);
                    document.getElementById('t-drag').innerText = drag.toFixed(2);
                } 
                else {
                    physicsState.phase = "Stable Orbit Achieved";
                    physicsState.orbitAngle += 0.03;
                    let orbitRad = bodies[physicsState.targetId].radius + 2;

                    satMesh.position.x = targetMesh.position.x + orbitRad * Math.cos(physicsState.orbitAngle);
                    satMesh.position.z = targetMesh.position.z + orbitRad * Math.sin(physicsState.orbitAngle);
                    satMesh.position.y = targetMesh.position.y + orbitRad * Math.sin(physicsState.orbitAngle) * 0.4; 

                    satMesh.lookAt(targetMesh.position);
                    satMesh.rotateX(Math.PI / 2);

                    document.getElementById('t-phase').innerText = physicsState.phase;
                    document.getElementById('t-vel').innerText = "7.66 (Orbital)";
                }

                // FIXED: We no longer delete points. The full green trail stays permanently.
                physicsState.trailPoints.push(satMesh.position.clone());
                trailLine.geometry.setFromPoints(physicsState.trailPoints);
            }

            raycaster.setFromCamera(mouse, camera);
            if(raycaster.intersectObjects(Object.values(planetMeshes)).length > 0) document.body.classList.add('pointing');
            else document.body.classList.remove('pointing');

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
